packages:
  - apps/*
  - packages/*

onlyBuiltDependencies:
  - "@sentry/cli"
  - "argon2"
  - "esbuild"
  - "msgpackr-extract"
  - "protobufjs"
  - "sharp"
  - "svelte-preprocess"

# Patched floors for transitive production dependencies with published advisories (#234).
# Each pins a range inside the dependent's own semver range, so remove an entry once the
# parent's lockfile resolution is at or above it on its own.
overrides:
  # @tailwindcss/typography pins postcss-selector-parser 6.0.10 (GHSA-rj75-hqrm-r3gf).
  postcss-selector-parser@<6.1.5: ">=6.1.5 <7"
  # rimraf 5 (via OpenTelemetry auto-instrumentations, gaxios) pulls glob 10 (GHSA-3g3m-2fjr-6pw4).
  "glob@>=9 <14.0.2": ">=14.0.2"
  # glob 10 pulls minimatch 9 (GHSA-g3hv-75wg-m249).
  "minimatch@>=7 <11.0.1": ">=11.0.1"
  # drizzle-kit's @esbuild-kit/core-utils pulls esbuild 0.18 (GHSA-67mh-4wv8-2f99).
  "esbuild@<0.25.0": ">=0.25.0 <0.26"

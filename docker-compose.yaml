# Local development only. Services use the default bridge network and publish their ports on 127.0.0.1,
# so they are reachable from this machine but not from the rest of the network (#235). Do not add
# `network_mode: host` (Compose then ignores `ports:` and every service listens on all interfaces) or
# publish a port without the 127.0.0.1 prefix; apps/api/src/test/docker-compose.test.ts enforces both.
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

  redis:
    image: redis:latest
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data

  seaweedfs:
    image: chrislusf/seaweedfs:3.79
    ports:
      - "127.0.0.1:8333:8333" # S3 API
      - "127.0.0.1:8888:8888" # Filer UI
      - "127.0.0.1:9333:9333" # Master
    volumes:
      - "seaweedfs_data:/data"
      - "./docker/seaweedfs/s3-config.json:/etc/seaweedfs/s3-config.json:ro"
    command: server -s3=true -s3.config=/etc/seaweedfs/s3-config.json -filer=true -dir=/data

  mailpit:
    image: axllent/mailpit
    volumes:
      - mailpit_data:/data
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"
    environment:
      MP_MAX_MESSAGES: 5000
      MP_DATABASE: /data/mailpit.db
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  spotlight:
    image: ghcr.io/getsentry/spotlight:latest
    ports:
      - "127.0.0.1:8969:8969"

  jaeger:
    image: jaegertracing/all-in-one:latest
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "127.0.0.1:16686:16686"  # Jaeger UI
      - "127.0.0.1:4318:4318"    # OTLP HTTP receiver
      - "127.0.0.1:4317:4317"    # OTLP gRPC receiver

  clamav:
    image: clamav/clamav:latest
    ports:
      - "127.0.0.1:3310:3310"
    volumes:
      - clamav_data:/var/lib/clamav

volumes:
  postgres_data:
  redis_data:
  mailpit_data:
  seaweedfs_data:
  clamav_data:
    driver: local
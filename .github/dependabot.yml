version: 2
updates:
  # Keeps the SHA-pinned actions in .github/ current; npm updates are not managed here.
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    target-branch: development
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - '*'
    commit-message:
      prefix: ci

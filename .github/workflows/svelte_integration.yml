name: Run_Svelte_Integration_on_PRs

on:
  pull_request:
    branches:
      - main
      - development
    paths-ignore:
      - '**.md'
      - '.knowledge-base/**'
      - 'docs/**'

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Throwaway values that only protect containers living for one run on this runner. No secrets here, so fork PRs work.
# Everything else comes from the defaults in apps/api/.env.schema, which point at the services started below.
env:
  SIGNING_SECRET: ci-only-not-a-secret-signing
  BETTER_AUTH_SECRET: ci-only-not-a-secret-better-auth-key
  ADMIN_PASSWORD: ci-only-not-a-secret-admin-password
  # Playwright turns this off for the servers it starts; the seed runs outside Playwright.
  HIBP_ENABLED: 'false'

jobs:
  e2e-tests:
    name: Run end-to-end tests
    timeout-minutes: 20
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: pnpm-setup
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Install playwright browsers
        run: pnpm --filter @adelie/web exec playwright install --with-deps chromium

      - name: Start services
        run: docker compose up -d postgres redis seaweedfs mailpit

      # Mailpit has to be up before the tests, or Playwright's global setup starts its stand-in instead.
      - name: Wait for services
        run: |
          timeout 60 bash -c 'until docker compose exec -T postgres pg_isready -h localhost -U postgres -q; do sleep 1; done'
          timeout 60 bash -c 'until docker compose exec -T redis redis-cli ping | grep -q PONG; do sleep 1; done'
          timeout 60 bash -c 'until curl -fsS -o /dev/null http://localhost:8025/api/v1/info; do sleep 1; done'
          pnpm storage:setup

      # Turbo's plan for the web app leaves out the API's build task, which compiles these.
      - name: Generate API Paraglide files
        run: pnpm --filter @adelie/api paraglide:compile

      - name: Migrate and seed the database
        run: |
          pnpm db:migrate
          pnpm db:seed

      # Only the web app's dependencies: Playwright builds the web app itself.
      - name: Build workspace dependencies
        run: pnpm turbo run build --filter=@adelie/web^...

      # Playwright directly: Turbo's strict env mode and the varlock filter in the test:e2e script would both drop the values above.
      - name: Run tests
        run: pnpm --filter @adelie/web exec playwright test

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 30
